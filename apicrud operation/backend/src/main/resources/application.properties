spring.application.name=ledgerly-api
server.port=8080
# Local development uses H2. Set SPRING_PROFILES_ACTIVE=mysql and environment variables for MySQL.
spring.datasource.url=jdbc:h2:file:./data/ledgerly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always
